# Drop-in for fs-phase23-worker@.service on worker_a / worker_b.
# Below interactive and GPU work, inside the host's admission headroom (crispdm-run caps each
# shard at FS23_CAP from runner.env; the slot count comes from the shard policy).
[Service]
Nice=10
IOSchedulingClass=best-effort
IOSchedulingPriority=7
CPUWeight=50
