# Drop-in for fs-phase23-worker@.service on the COORDINATOR (the owner's desktop).
# The standing rule forbids heavy batch here; this order assigns the coordinator the cheapest
# third of the shards explicitly, so the footprint is pinned to the minimum: one slot, a
# 1 GiB per-process cap (FS23_CAP in runner.env, enforced by crispdm-run), lowest CPU and IO
# priority, and the deployed admission monitor gating every start.
[Service]
Nice=19
IOSchedulingClass=idle
CPUWeight=20
CPUQuota=200%
